<ul class="space-y-2">
    {% for db in databases %}
    <li class="flex items-center justify-between p-3 border rounded {% if db == current_db %}bg-blue-100 border-blue-500{% endif %}">
        <span class="font-medium">{{ db }}</span>
        {% if db != current_db %}
        <form hx-post="/db_select" hx-target="#db-list" hx-swap="innerHTML">
            <input type="hidden" name="db_name" value="{{ db }}">
            <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">
                Select
            </button>
        </form>
        {% else %}
        <span class="text-blue-800 font-bold text-sm px-3 py-1">Active</span>
        {% endif %}
    </li>
    {% endfor %}
</ul>
