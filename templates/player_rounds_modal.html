<div id="modal" _="on closeModal add .closing then wait for animationend then remove me">
  <div class="modal-underlay" _="on click trigger closeModal"></div>
  <div class="modal-content">
    <div class="border-b border-gray-200 pb-2 mb-4">
        <h3 class="text-xl font-bold text-center text-gray-800">Match History</h3>
        <p class="text-sm text-center text-gray-500">{{player_name}}</p>
    </div>

    <div class="space-y-2 max-h-[60vh] overflow-y-auto px-1">
    {% for m in matchups %}
    <div class="flex items-center gap-3 bg-gray-50 p-2 rounded border border-gray-200">
        <div class="flex-1 text-right">
            <p class="font-medium text-gray-700 text-sm truncate">{{m.white_name}}</p>
        </div>

        <div class="flex gap-1 justify-center items-center bg-white px-2 py-1 rounded border border-gray-300 shadow-sm">
            <div class="w-6 text-center font-bold text-gray-800 text-sm">
                {{m.white_score}}
            </div>
            <span class="text-gray-300 text-xs font-bold">-</span>
            <div class="w-6 text-center font-bold text-gray-800 text-sm">
                {{m.black_score}}
            </div>
        </div>

        <div class="flex-1 text-left">
            <p class="font-medium text-gray-700 text-sm truncate">{{m.black_name}}</p>
        </div>
    </div>
    {% endfor %}
    </div>

    <div class="mt-6 text-center">
        <button
            class="bg-gray-800 hover:bg-black text-white font-bold py-2 px-6 rounded shadow-sm transition-colors"
            _="on click trigger closeModal">
            Close
        </button>
    </div>
  </div>
</div>
