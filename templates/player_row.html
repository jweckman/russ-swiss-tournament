<tr class="hover:bg-gray-50 group transition-colors">
    <td class="p-4 text-gray-500 font-mono text-sm">#{{ player.identifier }}</td>
    <td class="p-4 font-medium text-gray-800">
        {{ player.first_name }} <span class="text-gray-500">{{ player.last_name }}</span>
    </td>
    <td class="p-4 text-right flex justify-end gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
        <button hx-get="/players/{{ player.identifier }}/edit"
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="text-gray-400 hover:text-blue-600 p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
        <button hx-delete="/players/{{ player.identifier }}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete {{ player.get_full_name() }}?"
                class="text-gray-400 hover:text-red-600 p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
    </td>
</tr>
